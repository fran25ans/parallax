[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parallax-counterfactual-lab"
version = "0.1.0"
description = "Counterfactual bug discovery with executable evidence"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Francisco Jose Gimeno"}]

[project.scripts]
parallax = "parallax.cli:main"

[project.optional-dependencies]
nebius = ["contree-sdk>=0.3.6,<0.4"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[tool.setuptools.packages.find]
where = ["src"]
