<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">PARALLAX counterfactual proof architecture</title>
  <desc id="desc">Nemotron proposes one intervention, Nebius creates a checkpoint and two branches, and PARALLAX deterministically verifies the resulting evidence.</desc>
  <rect width="1440" height="560" fill="#090b0e"/>
  <text x="64" y="64" fill="#eef2f3" font-family="Arial, sans-serif" font-size="28" font-weight="700">PARALLAX PROOF PIPELINE</text>
  <text x="64" y="94" fill="#829099" font-family="Arial, sans-serif" font-size="15">AI proposes. Infrastructure executes. Deterministic code decides.</text>
  <g font-family="Arial, sans-serif">
    <rect x="64" y="154" width="238" height="116" fill="#11161b" stroke="#49d6d0" stroke-width="2"/>
    <text x="84" y="184" fill="#49d6d0" font-size="12" font-weight="700">01 · AI PROPOSED</text>
    <text x="84" y="220" fill="#eef2f3" font-size="22" font-weight="700">Nemotron Super</text>
    <text x="84" y="247" fill="#9ca8ae" font-size="14">One bounded intervention</text>
    <path d="M302 212 H370" stroke="#53616a" stroke-width="2"/><path d="M360 204 L370 212 L360 220" fill="none" stroke="#53616a" stroke-width="2"/>
    <rect x="370" y="154" width="238" height="116" fill="#11161b" stroke="#d8a84e" stroke-width="2"/>
    <text x="390" y="184" fill="#d8a84e" font-size="12" font-weight="700">02 · CHECKPOINT</text>
    <text x="390" y="220" fill="#eef2f3" font-size="22" font-weight="700">Nebius Sandbox</text>
    <text x="390" y="247" fill="#9ca8ae" font-size="14">Identical world state S₀</text>
    <path d="M608 212 H676" stroke="#53616a" stroke-width="2"/><path d="M666 204 L676 212 L666 220" fill="none" stroke="#53616a" stroke-width="2"/>
    <rect x="676" y="126" width="260" height="82" fill="#10151a" stroke="#52d39c" stroke-width="2"/>
    <text x="696" y="155" fill="#52d39c" font-size="12" font-weight="700">CONTROL BRANCH</text><text x="696" y="185" fill="#eef2f3" font-size="19" font-weight="700">Invariant passes</text>
    <rect x="676" y="226" width="260" height="82" fill="#10151a" stroke="#ef5b5b" stroke-width="2"/>
    <text x="696" y="255" fill="#ef7772" font-size="12" font-weight="700">COUNTERFACTUAL BRANCH</text><text x="696" y="285" fill="#eef2f3" font-size="19" font-weight="700">Invariant fails</text>
    <path d="M936 167 H992 V212 H1058" fill="none" stroke="#53616a" stroke-width="2"/><path d="M936 267 H992 V212" fill="none" stroke="#53616a" stroke-width="2"/><path d="M1048 204 L1058 212 L1048 220" fill="none" stroke="#53616a" stroke-width="2"/>
    <rect x="1058" y="154" width="318" height="116" fill="#11161b" stroke="#ef5b5b" stroke-width="2"/>
    <text x="1078" y="184" fill="#ef7772" font-size="12" font-weight="700">03 · DETERMINISTICALLY VERIFIED</text><text x="1078" y="220" fill="#eef2f3" font-size="22" font-weight="700">PARALLAX</text><text x="1078" y="247" fill="#9ca8ae" font-size="14">Causal counterexample: PROVEN</text>
    <rect x="64" y="366" width="1312" height="126" fill="#0d1115" stroke="#2b343b"/>
    <text x="88" y="402" fill="#77848d" font-size="12" font-weight="700">PROOF CONDITIONS</text>
    <text x="88" y="444" fill="#52d39c" font-size="17">✓ Same checkpoint</text><text x="370" y="444" fill="#52d39c" font-size="17">✓ One intervention</text><text x="676" y="444" fill="#52d39c" font-size="17">✓ Control passes</text><text x="1030" y="444" fill="#ef7772" font-size="17">✓ Counterfactual fails</text>
    <text x="88" y="475" fill="#829099" font-size="13">Evidence is persisted without credentials and protected by SHA-256 integrity hashes.</text>
  </g>
</svg>
